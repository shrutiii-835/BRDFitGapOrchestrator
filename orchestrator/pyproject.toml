[project]
name = "brd-fitmap-orchestrator"
version = "0.0.10"
description = "Conversational coordination of BRDGen, FitMap and TestCraft"
# No readme key: the one README lives at the repository root, and hatchling cannot
# reference a file outside this project directory. Pointing at a README.md that is not
# here fails the build, which is what happened between 934215e and this line.
# Tied to the one wheel below. It is tagged cp312-cp312-macosx_26_0_arm64 and ships
# compiled .so files built against CPython 3.12, so it cannot load on 3.13, and the SDK
# host publishes no 3.13 build to widen towards: every Python wheel it offers is cp312
# (Darwin 0.0.125 and the MinGW win_amd64 build), whatever the page's "Python 3.12+"
# wording suggests. That host offers no Linux wheel, though the SDK is published for
# Linux through the private CodeArtifact repository instead, so this pin is about the
# wheel named below and not about which platforms the SDK supports.
#
# This is also what both agents this orchestrator calls pin, to the character:
# AetherionAgents/explora_prism and AetherionAgents/fit_gap_agent both carry
# requires-python = ">=3.12.10,<3.13" against their own cp312 wheels.
#
# Widen this together with the wheel URL, never on its own.
requires-python = ">=3.12.10,<3.13"


dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.118-cp312-cp312-macosx_26_0_arm64.whl",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Fails the run below the current level, so a drop is noticed rather than reported.
# This gates a local run today; it gates a merge only once a runner exists.
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=95"
