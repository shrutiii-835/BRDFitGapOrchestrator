name: Unit Tests

on:
  # Both, deliberately. A pull_request run checks out the PR's merge commit by default,
  # and this PR's head and base have unrelated histories, so that ref may not exist.
  # The push trigger keeps the branch covered either way.
  pull_request:
    branches:
      - main
      - review
  push:
    branches:
      - main
      - review
  # Lets the workflow be started by hand from the Actions tab, on any branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The head commit itself, not the generated merge ref, which does not exist
          # when the branches have no common ancestor.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source test dependencies
        # Only the public PyPI packages the tests need. aetherion_sdk is private and
        # ships macOS/Windows wheels only, so tests/conftest.py stubs it here; the two
        # tests that assert on the real SDK's registration skip themselves and say so.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "temporalio==1.*" \
            "pytest==8.4.2" \
            "pytest-asyncio==1.3.0" \
            "pytest-cov==6.3.0" \
            "ruff==0.12.12"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run unit tests
        run: pytest -v --junitxml=test-results.xml --cov-report=xml:coverage.xml
